name: Create Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check if release already exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ github.ref_name }} already exists; skipping create."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Changelog body
        if: steps.release.outputs.exists != 'true'
        id: notes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          lines = text.splitlines()
          body = []
          capture = False
          for line in lines:
              if line.startswith("## [") and tag in line.split("]")[0]:
                  capture = True
                  continue
              if capture and line.startswith("## ["):
                  break
              if capture:
                  body.append(line)
          notes = "\n".join(body).strip() or f"Release {tag}."
          Path("release_notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        if: steps.release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        continue-on-error: true
