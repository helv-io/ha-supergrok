name: Create Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check if release already exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ github.ref_name }} already exists; will attach zip."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Changelog body
        if: steps.release.outputs.exists != 'true'
        id: notes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          lines = text.splitlines()
          body = []
          capture = False
          for line in lines:
              if line.startswith("## [") and tag in line.split("]")[0]:
                  capture = True
                  continue
              if capture and line.startswith("## ["):
                  break
              if capture:
                  body.append(line)
          notes = "\n".join(body).strip() or f"Release {tag}."
          Path("release_notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      # HACS zip_release extracts this archive into custom_components/supergrok/.
      # Files must sit at the zip root (manifest.json, not custom_components/...).
      - name: Build HACS zip
        run: |
          (
            cd custom_components/supergrok
            zip -r "$GITHUB_WORKSPACE/supergrok.zip" . -x '*__pycache__*' '*.pyc'
          )
          python3 - <<'PY'
          import zipfile
          names = zipfile.ZipFile("supergrok.zip").namelist()
          if "manifest.json" not in names:
              raise SystemExit("manifest.json must be at the zip root")
          if any(name.startswith("custom_components/") for name in names):
              raise SystemExit("zip must not nest custom_components/")
          print("\n".join(names))
          PY

      - name: Create GitHub Release
        if: steps.release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          files: supergrok.zip
          draft: false
          prerelease: false

      - name: Attach HACS zip to existing release
        if: steps.release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" supergrok.zip --clobber
