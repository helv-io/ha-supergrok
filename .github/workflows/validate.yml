name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  alert:
    name: Open an issue when the nightly run fails
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [hassfest, hacs]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - run: python3 .agent-checks/bin/agent-checks nightly-alert "${{ contains(needs.*.result, 'failure') && 'fail' || 'ok' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
